<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>賽事專業倒數計時器</title>

    <!-- 🚫 強制瀏覽器不快取 HTML 頁面 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入高辨識度等寬字體 JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between overflow-y-auto select-none">

    <!-- 頂部導航列 (非全螢幕時顯示) -->
    <header id="app-header" class="w-full max-w-4xl mx-auto px-4 py-3 flex items-center justify-between border-b border-gray-800 transition-all duration-300">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
            <h1 class="text-base sm:text-lg font-bold tracking-wide text-gray-200">賽事倒數計時器</h1>
        </div>
        <button id="fullscreen-btn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-medium rounded-lg text-gray-300 flex items-center gap-1.5 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            <span>全螢幕</span>
        </button>
    </header>

    <!-- 主要計時器顯示區 -->
    <main id="timer-container" class="flex-1 w-full max-w-4xl mx-auto px-4 flex flex-col items-center justify-center cursor-pointer py-4">
        <!-- 倒數看板 -->
        <div class="w-full bg-gray-900/80 border border-gray-800/80 rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center shadow-2xl relative overflow-hidden transition-all duration-300">
            
            <!-- 狀態提示標籤 -->
            <div id="status-badge" class="mb-2 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase bg-gray-800 text-gray-400 transition-all">
                準備就緒
            </div>

            <!-- 時間主數字 (點擊看板可切換 開始/暫停) -->
            <div id="time-display" class="timer-font text-[22vw] sm:text-[18vw] md:text-[140px] font-extrabold tracking-tighter text-white leading-none my-2 drop-shadow-lg">
                25:00
            </div>

            <!-- 進度條 -->
            <div class="w-full bg-gray-800/60 h-2 rounded-full overflow-hidden mt-4">
                <div id="progress-bar" class="bg-blue-600 h-full w-full transition-all duration-300"></div>
            </div>

            <!-- 全螢幕下顯示的極簡浮動控制提示 -->
            <div id="fs-hint" class="absolute bottom-3 text-xs text-gray-500 opacity-0 pointer-events-none transition-opacity">
                輕觸畫面任意處 開始 / 暫停
            </div>
        </div>
    </main>

    <!-- 下方控制與預設時間區 (非全螢幕時顯示) -->
    <footer id="app-footer" class="w-full max-w-4xl mx-auto px-4 pb-6 transition-all duration-300">
        
        <!-- 快捷預設時間按鈕 -->
        <div class="mb-4">
            <p class="text-xs text-gray-400 mb-2 font-medium">快速設定預設時間：</p>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                <button onclick="setTimer(1)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">1 分</button>
                <button onclick="setTimer(3)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">3 分</button>
                <button onclick="setTimer(5)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">5 分</button>
                <button onclick="setTimer(10)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">10 分</button>
                <button onclick="setTimer(15)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">15 分</button>
                <button onclick="setTimer(25)" class="preset-btn py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition border border-blue-500/40 text-blue-400">25分賽</button>
                <button onclick="setTimer(30)" class="preset-btn col-span-2 sm:col-span-1 py-2.5 bg-gray-800/80 hover:bg-gray-700 active:scale-95 text-xs sm:text-sm font-bold rounded-xl transition">30 分</button>
            </div>
        </div>

        <!-- 自訂時間與控制按鈕 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="col-span-2 flex items-center bg-gray-900 border border-gray-800 rounded-xl px-3 py-2">
                <span class="text-xs text-gray-400 mr-2 whitespace-nowrap">自訂(分):</span>
                <input type="number" id="custom-minutes" min="1" max="180" value="25" class="w-full bg-transparent text-white font-bold text-base focus:outline-none timer-font">
                <button onclick="applyCustomTime()" class="ml-2 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:scale-95 text-xs font-semibold rounded-lg text-gray-300 transition">設定</button>
            </div>
            
            <button id="start-pause-btn" onclick="toggleTimer()" class="py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-sm sm:text-base font-bold rounded-xl shadow-lg shadow-blue-900/30 text-white transition flex items-center justify-center gap-1.5">
                <svg id="play-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                <span id="start-pause-text">開始計時</span>
            </button>

            <button onclick="resetTimer()" class="py-3 bg-gray-800 hover:bg-gray-700 active:scale-95 text-sm sm:text-base font-bold rounded-xl text-gray-300 transition flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>重設</span>
            </button>
        </div>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        let totalSeconds = 25 * 60;
        let remainingSeconds = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let audioCtx = null;

        const timeDisplay = document.getElementById('time-display');
        const startPauseText = document.getElementById('start-pause-text');
        const playIcon = document.getElementById('play-icon');
        const statusBadge = document.getElementById('status-badge');
        const progressBar = document.getElementById('progress-bar');
        const timerContainer = document.getElementById('timer-container');
        const appHeader = document.getElementById('app-header');
        const appFooter = document.getElementById('app-footer');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fsHint = document.getElementById('fs-hint');

        // 初始化音訊環境 (Web Audio API 支援離線發声)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 播放提示音
        function playBeep(frequency = 800, duration = 0.15, type = 'sine') {
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('Audio playback prevented or unsupported');
            }
        }

        // 播放時間到警示三連音
        function playAlarm() {
            playBeep(600, 0.2);
            setTimeout(() => playBeep(600, 0.2), 250);
            setTimeout(() => playBeep(900, 0.4), 500);
        }

        // 更新畫面顯示
        function updateDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            // 更新進度條
            const percent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
            progressBar.style.width = `${percent}%`;

            // 更新網頁標題
            document.title = `${timeDisplay.textContent} - 賽事計時器`;
        }

        // 設定時間
        function setTimer(minutes) {
            pauseTimer();
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            updateDisplay();
        }

        // 套用自訂時間
        function applyCustomTime() {
            const inputVal = parseInt(document.getElementById('custom-minutes').value);
            if (!isNaN(inputVal) && inputVal > 0) {
                setTimer(inputVal);
            }
        }

        // 開始 / 暫停切換
        function toggleTimer() {
            initAudio();
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            isRunning = true;
            startPauseText.textContent = '暫停';
            playIcon.innerHTML = '<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>';
            statusBadge.textContent = '計時中...';
            statusBadge.className = 'mb-2 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase bg-blue-900/60 text-blue-300 border border-blue-700/50';
            progressBar.className = 'bg-blue-500 h-full w-full transition-all duration-300';

            timerId = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                    
                    // 最後 5 秒短提示音
                    if (remainingSeconds <= 5 && remainingSeconds > 0) {
                        playBeep(440, 0.1);
                    }
                }

                if (remainingSeconds <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    startPauseText.textContent = '開始計時';
                    playIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>';
                    statusBadge.textContent = '時間到！';
                    statusBadge.className = 'mb-2 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase bg-red-900/80 text-red-300 border border-red-600 animate-bounce';
                    progressBar.className = 'bg-red-500 h-full w-full transition-all duration-300';
                    playAlarm();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerId);
            startPauseText.textContent = '繼續';
            playIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>';
            if (remainingSeconds > 0 && remainingSeconds < totalSeconds) {
                statusBadge.textContent = '已暫停';
                statusBadge.className = 'mb-2 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase bg-yellow-900/60 text-yellow-300 border border-yellow-700/50';
            }
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
            statusBadge.textContent = '準備就緒';
            statusBadge.className = 'mb-2 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase bg-gray-800 text-gray-400';
            progressBar.className = 'bg-blue-600 h-full w-full transition-all duration-300';
        }

        // 點擊計時器看板切換 開始/暫停
        timerContainer.addEventListener('click', () => {
            toggleTimer();
        });

        // 全螢幕切換與自動隱藏上下選單邏輯
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`無法切換全螢幕: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            if (isFs) {
                appHeader.classList.add('hidden');
                appFooter.classList.add('hidden');
                fullscreenBtn.textContent = '退出';
                fsHint.classList.remove('opacity-0');
            } else {
                appHeader.classList.remove('hidden');
                appFooter.classList.remove('hidden');
                fullscreenBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg><span>全螢幕</span>`;
                fsHint.classList.add('opacity-0');
            }
        });

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
